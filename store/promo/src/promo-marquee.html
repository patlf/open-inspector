<!doctype html><html><head><meta charset="utf-8"><style>
  * { box-sizing: border-box; margin: 0; }
  :root {
    --bg: #14181c;
    --raised: #1b2126;
    --ink: #e6eaec;
    --ink-soft: #b3bcc2;
    --ink-mute: #838d94;
    --rule: #2b343a;
    --accent: #e4743f;
    --good: #6aab84;
    --mono: ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }
  html, body { width: 100%; height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }
  /*
   * The mark is the overlay's own selection marquee: four corner brackets
   * around empty space. Same shape as the extension icon, so the tile, the
   * icon and the thing you see on screen are visibly one object.
   */
  .mark { flex: none; }

  body { display: grid; grid-template-columns: 1fr 420px; align-items: center; gap: 56px; padding: 0 0 0 76px; }
  .left { display: flex; flex-direction: column; gap: 22px; max-width: 640px; }
  .top { display: flex; align-items: center; gap: 14px; }
  .name { font-family: var(--mono); font-size: 32px; font-weight: 600; letter-spacing: -0.03em; }
  h1 { font-size: 44px; line-height: 1.14; letter-spacing: -0.025em; font-weight: 600; text-wrap: balance; }
  h1 em { font-style: normal; color: var(--accent); }
  .sub { font-size: 19px; line-height: 1.5; color: var(--ink-soft); max-width: 46ch; }
  .facts { display: flex; gap: 10px; }
  .fact {
    font-family: var(--mono); font-size: 12px; letter-spacing: 0.04em;
    padding: 7px 11px; border-radius: 4px; color: var(--ink-mute); border: 1px solid var(--rule);
  }
  .fact.good { color: var(--good); border-color: rgba(106,171,132,0.45); background: rgba(106,171,132,0.10); }
  /* Bled off the right edge, so the panel reads as a real window, not a sticker. */
  .shot { position: relative; height: 100%; overflow: hidden; }
  .shot img { position: absolute; top: 40px; left: 0; width: 420px; border-radius: 8px 0 0 8px;
              box-shadow: -18px 0 60px -20px rgba(0,0,0,0.75); }
</style></head><body>
