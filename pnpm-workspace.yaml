packages:
  - packages/*
  - apps/*
# esbuild's install script fetches its platform-native binary; Vite cannot
# build without it. spawn-sync is a legacy polyfill whose optional native
# build we do not need. msw arrives with @vitest/browser and its script only
# generates a mock service worker, which browser-mode tests here never use.
allowBuilds:
  esbuild: true
  msw: false
  spawn-sync: false
